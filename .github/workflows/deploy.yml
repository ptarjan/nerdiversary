# Publish the static site to GitHub Pages on every push to main. There is no
# build: generated files (landing pages, sitemap, OG cards) are committed, and
# this job copies the served files into dist/.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push cancels a deployment still in progress
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build site
        run: |
          mkdir -p dist

          # Only what is copied here is published; a new top-level file (other than *.html) or directory needs adding
          cp *.html sw.js robots.txt sitemap.xml dist/
          cp -r css dist/
          cp -r js dist/
          cp -r assets dist/
          cp manifest.json favicon.ico dist/
          cp .nojekyll dist/

          # Unknown paths under /nerdiversary/ send the reader to the app, not the domain root
          cat > dist/404.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta http-equiv="refresh" content="0; url=/nerdiversary/">
              <title>Page not found - Nerdiversary</title>
          </head>
          <body>
              <p>That page doesn't exist. Taking you to <a href="/nerdiversary/">Nerdiversary</a>.</p>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

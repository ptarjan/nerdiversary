# Deploy worker/ to Cloudflare after the unit tests pass. Runs on pushes to
# main that touch the worker, the js/ modules it bundles, or the tests. Needs
# the CLOUDFLARE_API_TOKEN repo secret. D1 schema changes are not applied
# here; run worker/schema.sql by hand (see worker/wrangler.toml).
name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - 'worker/**'
      - 'js/**'
      - 'test/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run Tests
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Run tests
        run: node test/nerdiversary.test.js

  deploy:
    runs-on: ubuntu-latest
    name: Deploy Worker
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker

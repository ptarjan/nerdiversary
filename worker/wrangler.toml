# Cloudflare Worker behind the calendar feed, share-link previews and push
# notifications. Deployed by .github/workflows/deploy-worker.yml. It is served
# at https://nerdiversary-calendar.<account>.workers.dev; WORKER_URL in
# js/shared.js must point at that address.
name = "nerdiversary-calendar"
main = "worker.js"
compatibility_date = "2024-01-01"

# Push notifications need the D1 binding below plus the VAPID secrets. Without
# them the /push/* endpoints answer 503 and the cron returns early; the
# calendar feed and /share need neither.
#
# One-time setup for a new account (run from worker/):
#   wrangler d1 create nerdiversary-db          # put the printed id in database_id
#   wrangler d1 execute nerdiversary-db --remote --file=./schema.sql
#   npx web-push generate-vapid-keys
#   wrangler secret put VAPID_PUBLIC_KEY
#   wrangler secret put VAPID_PRIVATE_KEY
#   wrangler secret put VAPID_SUBJECT           # optional, e.g. mailto:you@example.com
#   wrangler secret put ADMIN_TOKEN             # optional: enables GET /push/notification-log

[[d1_databases]]
binding = "DB"
database_name = "nerdiversary-db"
database_id = "a9e7cd62-6a7f-4ea1-9671-6794ecf2b59d"

# Every minute: read all active family members, match each against the
# precomputed milestone offsets in memory, and send the pushes due now.
[triggers]
crons = ["* * * * *"]
